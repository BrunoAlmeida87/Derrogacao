# Mantém a branch gh-pages idêntica à main.
# Em Settings > Pages, escolha "Deploy from a branch" > gh-pages > / (root).
# Essa rota não exige a permissão de criação de site que o token do Actions
# não possui neste repositório.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Espelhar main em gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force origin "${GITHUB_SHA}:refs/heads/gh-pages"
