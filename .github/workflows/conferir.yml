# Os arquivos únicos (derrogacao.html e derrogacao-visualizador.html) são
# conteúdo derivado do index.html e dos assets, e estão versionados. Sem esta
# conferência eles envelheceriam em silêncio: quem baixasse o repositório
# levaria uma versão antiga do programa, achando que levava a de agora.
name: Conferir o arquivo único

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Os arquivos únicos (editor e visualizador) correspondem ao index.html e aos assets?
        run: python3 tools/build-standalone.py --conferir
